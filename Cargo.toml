[package]
name = "tugport"
version = "0.1.6"
edition = "2024"
license = "MIT"
description = "Self-hosted deploy platform in one binary"
repository = "https://github.com/backmeupplz/tugport"

[dependencies]
aes = "0.8"
aho-corasick = "1"
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
bollard = "0.19"
bytes = "1"
cbc = { version = "0.1", features = ["alloc"] }
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
croner = "4"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
ipnet = { version = "2", features = ["serde"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
libc = "0.2"
mime_guess = "2"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = "8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sysinfo = "0.34"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tokio-util = { version = "0.7", features = ["io"] }
totp-rs = { version = "5", features = ["otpauth", "gen_secret"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zeroize = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
