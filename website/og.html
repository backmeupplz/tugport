<!DOCTYPE html>
<!-- Source of og.png (1200×630). Re-render: see README. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Tugport share image</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(640px 420px at 1040px 40px, rgba(255, 106, 61, 0.22), transparent 70%),
      radial-gradient(520px 360px at 120px 640px, rgba(79, 209, 197, 0.08), transparent 70%),
      #0B1018;
    color: #E9EEF5;
    padding: 92px 96px;
    display: flex; flex-direction: column;
    font-family: Inter, sans-serif;
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .top img { width: 100px; height: 100px; border-radius: 23px; box-shadow: 0 18px 50px rgba(255, 106, 61, 0.25); }
  .top span { font: 500 26px/1 "JetBrains Mono", monospace; color: #FF8A64; }
  h1 { font: 700 118px/1 "Space Grotesk", sans-serif; letter-spacing: -0.035em; margin-top: 34px; }
  p { font-size: 35px; line-height: 1.3; color: #A3AFC0; margin-top: 14px; max-width: 860px; }
  ul { list-style: none; display: flex; gap: 14px; margin-top: auto; }
  li { font: 500 21px/1 "JetBrains Mono", monospace; color: #C9D2DE; border: 1px solid #2B3A50; background: rgba(19, 28, 41, 0.8); border-radius: 12px; padding: 13px 18px; }
</style>
</head>
<body>
  <div class="top"><img src="logo.svg" alt=""><span>tugport.com</span></div>
  <h1>Tugport</h1>
  <p>Deploy your apps and watch your server from one small Rust binary.</p>
  <ul><li>push to deploy</li><li>live logs</li><li>server charts</li><li>scoped agent keys</li></ul>
</body>
</html>
