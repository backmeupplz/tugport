<!DOCTYPE html>
<!-- Source of og.png (1200×630). Re-render: see README. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Tugport share image</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(700px 500px at 1000px 80px, rgba(255, 106, 61, 0.16), transparent 70%), #0A0E14;
    color: #E8EDF4; font-family: Inter, sans-serif;
    display: grid; grid-template-columns: 470px 560px; gap: 42px; align-items: center;
    padding: 64px 64px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 56px; height: 56px; border-radius: 13px; }
  .brand span { font: 700 34px/1 "Space Grotesk", sans-serif; letter-spacing: -0.02em; }
  h1 { font: 600 50px/1.06 "Space Grotesk", sans-serif; letter-spacing: -0.03em; margin-top: 38px; text-wrap: balance; }
  h1 em { font-style: normal; color: #FF6A3D; }
  p { margin-top: 22px; font-size: 22px; line-height: 1.45; color: #A2AEBE; text-wrap: balance; }
  .url { margin-top: 34px; font: 500 21px/1 "JetBrains Mono", monospace; color: #FF8A64; }
  .frame {
    width: 560px; border: 1px solid #2A394D; border-radius: 14px; overflow: hidden; background: #111823;
    box-shadow: 0 40px 90px -20px rgba(0, 0, 0, 0.8);
  }
  .frame img { display: block; width: 100%; }
</style>
</head>
<body>
  <div>
    <div class="brand"><img src="logo.svg" alt=""><span>Tugport</span></div>
    <h1>Deploy your apps to <em>servers you own.</em></h1>
    <p>One Rust binary next to Docker, with logs, charts, backups and keys for AI agents built in.</p>
    <div class="url">tugport.com</div>
  </div>
  <div class="frame"><img src="shots/hero-dark.webp" alt=""></div>
</body>
</html>
